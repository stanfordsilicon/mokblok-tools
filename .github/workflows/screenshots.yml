name: Screenshot tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshot-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screenshot-tests:
    name: Playwright screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run screenshot tests
        run: npm run screenshots:update
        # for now always updating snapshots, presuming the new screenshots are correct.

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload screenshot differences
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-differences
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '[automation] Auto-update screenshots'
          commit_user_name: 'SILICON Bot'
          commit_user_email: 'noreply@github.com'
          skip_dirty_check: false